<h2>KOSZYK</h2>

@if (cart.length === 0) {
  <p>Koszyk jest pusty.</p>
} @else {
  @for (product of cart; track $index) {
    <p class="product">
      {{ product.name }} {{ product.price }} zł
      <button matIconButton (click)="removeProduct(product)">
        <mat-icon>delete</mat-icon>
      </button>
    </p>
  }

  <hr />

  <p>RAZEM {{ getTotal() }} zł</p>
}
