<div class="product">
  <button mat-icon-button routerLink="/" class="powrot-button">
    <mat-icon>arrow_back</mat-icon>
  </button>
  <section>
    <h1>{{ product?.name }}</h1>
    <div class="imageBox">
      <img src="{{ product?.img }}" alt="{{ product?.name }}" />
    </div>
    <button (click)="dodaj()" class="buyButton">Dodaj Do Koszyka</button>
    @if (product?.desc) {
      <h2>Opis</h2>
      <p>{{ product?.desc }}</p>
    }
  </section>
</div>
