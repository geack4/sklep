<button mat-icon-button routerLink="/" class="powrot-button">
  <mat-icon>arrow_back</mat-icon>
</button>
<main>
  <section>
    @if (this.store.getTotal() !== 0) {
      <aside>
        <app-cart></app-cart>
      </aside>
      <aside class="payment">
        <h2>Do Zapłaty</h2>
        <p class="kwota">{{ this.store.getTotal() }}zł</p>
        <p>Kod rabatowy:</p>
        <p class="rabat">
          <input
            type="text"
            name="rabat"
            id="rabat"
            placeholder="XXXXXX"
            maxlength="6"
            #rabatInput
          />
          <button mat-icon-button class="checkCode" (click)="checkCode(rabatInput.value)">
            <mat-icon>check_circle</mat-icon>
          </button>
        </p>
        @if (this.codeError) {
          <p class="error">Niepoprawny kod.</p>
        } @else if (this.store.codeUsed) {
          <p class="accepted">Kod {{ this.store.codeUsed.code }} wprowadzony!</p>
        }
        <button class="kup" routerLink="/payment">Zapłać</button>
      </aside>
    } @else {
      <article>
        <p>Koszyk jest pusty</p>
        <button routerLink="/">Wróć do strony produktów</button>
      </article>
    }
  </section>
</main>
